services:
  portfolio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    ports:
      # Loopback only: the reverse proxy (Caddy) must run on this same host.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    networks:
      - portfolio-network
    volumes:
      - tracking-data:/app/data

# Nginx removed - configure in 宝塔面板 instead

networks:
  portfolio-network:
    driver: bridge

volumes:
  ssl:
  tracking-data:
